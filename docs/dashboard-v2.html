<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRTaker — Redirecting…</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/app-v3/">
<style>
  html,body{height:100%;margin:0;background:#0b1526;color:#cfd8e6;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
  .box{text-align:center;padding:24px}
  .spin{width:34px;height:34px;border:3px solid rgba(47,128,237,.25);border-top-color:#2F80ED;border-radius:50%;margin:0 auto 16px;animation:krspin .8s linear infinite}
  @keyframes krspin{to{transform:rotate(360deg)}}
  a{color:#2F80ED}
</style>
<script>
/* dashboard-v2.html has been retired — everything now lives in app-v3.
   Preserve deep links: invoice pay links (?inv=&pay=1), gateway callbacks
   (?gw=&sid=&val_id=&status=), and legacy #module hashes. */
(function () {
  var base = '/app-v3/';
  var q = new URLSearchParams(location.search);
  var hash = location.hash || '';
  var target = base;
  var gw = q.get('gw'), sid = q.get('sid');
  var inv = q.get('inv'), pay = q.get('pay');

  if (gw && sid) {
    // Gateway return — keep EVERY original param (val_id/paymentID/status/…) in the hash query
    var parts = [];
    q.forEach(function (v, k) { parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v)); });
    target = base + '#/dashboard?' + parts.join('&');
  } else if (inv) {
    // Invoice email pay link → open the invoice drawer (+ payment modal when pay=1)
    target = base + '#/invoices?open=' + encodeURIComponent(inv) + (pay === '1' ? '&pay=1' : '');
  } else if (hash && hash.length > 1) {
    // Legacy module hashes (#invoices, #maintenance, …) → app-v3 routes
    var m = hash.replace(/^#\/?/, '').split('?')[0].split('/')[0];
    var map = {
      dashboard: '/dashboard', invoices: '/invoices', maintenance: '/maintenance',
      tenants: '/tenants', units: '/units', leases: '/leases', payments: '/payments',
      receipts: '/receipts', utilities: '/utility-bills', settings: '/settings',
      documents: '/documents', ai: '/ai', analytics: '/analytics', trust: '/compliance',
      legal: '/legal', notices: '/notices', tickets: '/support', profile: '/settings',
      properties: '/properties', staff: '/staff', vendors: '/vendors', cases: '/cases'
    };
    target = base + '#' + (map[m] || '/dashboard');
  }
  location.replace(target);
})();
</script>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>Redirecting to the new KRTaker dashboard…</div>
    <div style="margin-top:10px;font-size:13px;color:#7d8ba1">Not redirecting? <a href="/app-v3/">Open the new dashboard</a></div>
  </div>
</body>
</html>
